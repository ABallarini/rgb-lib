[package]
name = "rgb-lib-wasm"
version = "0.1.0"
authors = [
    "Zoe Faltibà <zoefaltiba@gmail.com>",
    "Nicola Busanello <nicola.busanello@gmail.com>",
]
edition = "2024"
rust-version = "1.94.0"
repository = "https://github.com/RGB-Tools/rgb-lib"
homepage = "https://github.com/RGB-Tools/rgb-lib"
license = "MIT"
description = "wasm-bindgen bindings for the rgb-lib wallet"

[lib]
crate-type = ["cdylib", "rlib"]
name = "rgb_lib_wasm"

[dependencies]
# The shared wallet, over the in-memory backend: `wallet` without `sqlite` keeps the SQLite
# driver, Tokio and the migration crate out of the wasm graph.
rgb-lib = { version = "0.3.0-beta.7", path = "../../", default-features = false, features = [
    "wallet",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# Separate crate, like `c-ffi` and `uniffi`: its own lockfile and no membership in the rgb-lib
# workspace, so the root lockfile and default build stay untouched.
[workspace]
