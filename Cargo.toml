[package]
name = "rgb-lib"
version = "0.3.0-beta.7"
authors = [
    "Zoe Faltibà <zoefaltiba@gmail.com>",
    "Nicola Busanello <nicola.busanello@gmail.com>",
]
edition = "2024"
rust-version = "1.94.0"
repository = "https://github.com/RGB-Tools/rgb-lib"
homepage = "https://github.com/RGB-Tools/rgb-lib"
license = "MIT"
description = "RGB wallet library"
exclude = ["migration"]

[workspace]
members = [".", "migration"]

[dependencies]
base64 = { version = "0.23.1", optional = true, default-features = false, features = [
    "std",
] }
bdk_wallet = { version = "=3.2.0", optional = true, default-features = false, features = [
    "keys-bip39",
    "std",
] }
bdk_chain = { version = "0.23", optional = true, default-features = false }
bdk_bitcoind_rpc = { version = "0.22.1", optional = true, default-features = false, features = [
    "std",
] }
bdk_electrum = { version = "0.24.1", optional = true, default-features = false, features = [
    "use-rustls",
] }
bdk_esplora = { version = "0.22.3", optional = true, default-features = false, features = [
    "blocking-https-rustls",
] }
chacha20poly1305 = { version = "0.11.0", optional = true, default-features = false, features = [
    "alloc",
] }
ed25519-dalek = { version = "3", optional = true, default-features = false }
x25519-dalek = { version = "3", optional = true, default-features = false, features = [
    "static_secrets",
] }
hkdf = { version = "0.13", optional = true, default-features = false }
hmac = { version = "0.13", optional = true, default-features = false }
sha2 = { version = "0.11", optional = true, default-features = false }
hex = { version = "0.4.3", default-features = false, features = [
    "alloc",
] }
rand = { version = "0.10.3", optional = true, default-features = false, features = [
    "thread_rng",
] }
reqwest = { version = "0.13", optional = true, default-features = false, features = [
    "blocking",
    "json",
    "multipart",
] }
scrypt = { version = "0.12.0", optional = true, default-features = false, features = [
    "phc",
] }
sea-orm = { version = "2.0.4", optional = true, default-features = false, features = [
    "macros",
    "with-json",
] }
sea-query = { version = "1.0.2", optional = true }
serde = { version = "^1.0", default-features = false, features = [
    "derive",
] }
serde_json = { version = "^1.0", optional = true, default-features = false, features = [
    "preserve_order",
] }
slog = { version = "2.8.2", optional = true, default-features = false }
slog-async = { version = "2.8.0", optional = true, default-features = false }
slog-term = { version = "2.9.2", optional = true, default-features = false }
tempfile = { version = "3.27.0", optional = true, default-features = false }
thiserror = { version = "2.0", default-features = false }
time = { version = "0.3.55", optional = true, default-features = false }
file-format = { version = "0.29.0", optional = true, default-features = false, features = [
    "reader",
] }
url = { version = "2.5", optional = true, default-features = false }
walkdir = { version = "2.5.0", optional = true, default-features = false }
zip = { version = "9.4.1", optional = true, default-features = false, features = [
    "zstd",
] }

# RGB-related deps
amplify = { version = "=4.8.1", default-features = false }
rgb-invoicing = { version = "0.11.2-rc.1", default-features = false }
rgb-psbt-utils = { version = "0.11.2-rc.1", optional = true, default-features = false }
rgb-schemas = { version = "0.11.2-rc.1", default-features = false }
rgb-ops = { version = "0.11.2-rc.1", default-features = false, features = [
    "fs",
    "serde",
] }
rgb-strict-encoding = { version = "1.0.5", default-features = false, features = [
    "bitcoin",
] }
rgb-strict-types = { version = "1.0.5", default-features = false }

# SQLite, Tokio and the TLS stack behind them are native only: on wasm32 the wallet runs over the
# in-memory backend, so these cannot appear in its dependency graph (mio, libsqlite3-sys and ring
# do not build there). The optional flags and the `wallet` feature entries stay the same.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rgb-lib-migration = { path = "migration", version = "0.3.0-beta.5", optional = true }
rustls = { version = "0.23.46", optional = true, default-features = false }
sea-orm = { version = "2.0.4", optional = true, default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-sqlite",
    "with-json",
] }
tokio = { version = "1", optional = true, default-features = false }

# Browser entropy for the wasm32 wallet: getrandom has no backend of its own on
# wasm32-unknown-unknown, so each version in the lock needs its JS feature. Today those come in
# transitively (amplify enables 0.2 `js`, rgb-consensus/rgb-ops enable 0.3 `wasm_js`, zip enables
# 0.4 `wasm_js`); declaring them here keeps the wallet RNG independent of those upstream features
# staying enabled. Optional and enabled by `wallet`, so the wallet-less wasm build stays free of
# wasm-bindgen. The target gate keeps the native dependency graph unchanged.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "=0.2.17", optional = true, default-features = false, features = [
    "js",
] }
getrandom_03 = { package = "getrandom", version = "=0.3.4", optional = true, default-features = false, features = [
    "wasm_js",
] }
getrandom_04 = { package = "getrandom", version = "=0.4.3", optional = true, default-features = false, features = [
    "wasm_js",
] }
# IndexedDB persistence for the wasm32 wallet. Optional and enabled by `wallet`, so the native
# dependency graph stays free of the browser crates and the wallet-less wasm build stays free of
# them too. Only the web-sys features the snapshot store uses are enabled.
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "DomException",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "Window",
] }

# Browser clock for the wasm32 wallet: `time` reads the clock with SystemTime::now(), which panics
# on wasm32-unknown-unknown unless its browser shim is enabled. Same version and features as the
# native entry above, plus `wasm-bindgen`; optional and enabled by `wallet`, so the native
# dependency graph and the wallet-less wasm build stay unchanged.
[target.'cfg(target_arch = "wasm32")'.dependencies.time]
version = "0.3.55"
optional = true
default-features = false
features = ["wasm-bindgen"]

[dev-dependencies]
chrono = "0.4"
copy_dir = { version = "0.1.3", default-features = false }
dircmp = { version = "0.2.0", default-features = false }
once_cell = { version = "1.21", default-features = false }
regex = { version = "1.13", default-features = false }
serial_test = { version = "4.0", default-features = false }

# mockito pulls a Tokio runtime with the net driver (mio), which does not build on
# wasm32-unknown-unknown; only the native HTTP tests use it. confy pulls `home` and biscuit-auth
# reads the clock from `perf_counter`, both likewise native only (the tests using them live in
# `wallet/test`, which is not compiled for wasm32).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
mockito = { version = "1", default-features = false }
confy = { version = "2.0.0", default-features = false, features = [
    "toml_conf",
] }
biscuit-auth = { version = "6.0.0", default-features = false, features = [
    "datalog-macro",
]}

# Browser test runner for the wasm32 wallet lifecycle test; only the wasm32 target builds it.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { version = "0.3" }

# OS-specific reqwest features
[target.'cfg(target_os = "android")'.dependencies.reqwest]
version = "0.13"
optional = true
features = ["native-tls-vendored"]

[target.'cfg(not(target_os = "android"))'.dependencies.reqwest]
version = "0.13"
optional = true
features = ["rustls"]

[features]
default = ["wallet", "bitcoind", "electrum", "esplora", "bdk_file_store_migration", "rgb_fs_store_migration"]
all = ["wallet", "bitcoind", "electrum", "esplora", "bdk_file_store_migration", "rgb_fs_store_migration"]
# the wallet functionality; without it only the APIs that don't need a wallet (e.g. consignment
# inspection) are available, pulling in just the RGB crates and few other lightweight dependencies
wallet = [
    "dep:base64",
    "dep:bdk_wallet",
    "dep:bdk_chain",
    "dep:chacha20poly1305",
    "dep:ed25519-dalek",
    "dep:x25519-dalek",
    "dep:hkdf",
    "dep:hmac",
    "dep:sha2",
    "dep:tokio",
    "dep:rand",
    "dep:rgb-lib-migration",
    "dep:rustls",
    "dep:scrypt",
    "dep:sea-orm",
    "dep:sea-query",
    "dep:serde_json",
    "dep:slog",
    "dep:slog-async",
    "dep:slog-term",
    "dep:tempfile",
    "dep:time",
    "dep:file-format",
    "dep:getrandom_02",
    "dep:getrandom_03",
    "dep:getrandom_04",
    "dep:js-sys",
    "dep:url",
    "dep:walkdir",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:zip",
    "dep:rgb-psbt-utils",
]
# import the BDK data of wallets created before the changeset moved into the rgb-lib DB; only
# needed to upgrade such wallets, so it can be turned off to drop the bdk_file_store dependency
bdk_file_store_migration = ["wallet", "bdk_wallet/file_store"]
# import the RGB data (and convert the consignment/fascia files) of wallets created before the RGB
# data moved into the rgb-lib DB; only needed to upgrade such wallets, so it can be turned off to
# drop the legacy formats support of rgb-ops
rgb_fs_store_migration = ["wallet", "rgb-ops/legacy"]
# implied by each indexer feature, marking a build that can reach the network; it exists only to
# avoid repeating the list of indexer features in cfgs and must not be enabled on its own
_online = ["wallet"]
bitcoind = [
    "_online",
    "bdk_bitcoind_rpc",
    "reqwest",
    "rgb-ops/bitcoind_blocking",
]
electrum = [
    "_online",
    "bdk_electrum",
    "reqwest",
    "rgb-ops/electrum_blocking",
]
esplora = [
    "_online",
    "bdk_esplora",
    "reqwest",
    "rgb-ops/esplora_blocking",
]
camel_case = []

[profile.release]
# make overflow bugs fail loudly instead of producing wrong amounts
overflow-checks = true

[profile.reldebug]
inherits = "release"
debug = 1
